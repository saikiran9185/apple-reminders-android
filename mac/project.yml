name: RemindersBridge
options:
  bundleIdPrefix: com.saikiran
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: NO
targets:
  RemindersBridge:
    type: application
    platform: macOS
    sources: [Sources/App]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.saikiran.RemindersBridge
        PRODUCT_NAME: Reminders Bridge
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/App.entitlements
